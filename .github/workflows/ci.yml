name: CI
on:
  push:
jobs:
  kmp:
    # Kotlin Multiplatform client (multiplatform/): JVM tests here, iOS on macOS below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - run: gradle jvmTest --no-daemon
        working-directory: multiplatform
  kmp-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - run: gradle iosSimulatorArm64Test --no-daemon
        working-directory: multiplatform